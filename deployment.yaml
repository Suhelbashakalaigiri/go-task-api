apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-task-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-task-api
  template:
    metadata:
      labels:
        app: go-task-api
    spec:
      containers:
       - name: go-task-api
         image: suhelbasha7324/go-task-api:10
         ports:
          - containerPort: 8080